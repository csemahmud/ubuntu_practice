spring.application.name=LogInPostGre2508App

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/db_LogInPostGre2508App
spring.datasource.username=postgres
spring.datasource.password=123456
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# Hibernate 6 usually auto-detects dialect, but it’s fine to be explicit:
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=9191
spring.flyway.enabled=false
